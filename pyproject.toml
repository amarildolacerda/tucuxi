[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secur"
version = "1.0.0"
description = "Sistema de vigilância inteligente para câmeras IP com IA e alertas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Secur Project" }
]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "flask",
  "opencv-python-headless",
  "numpy",
  "python-dotenv",
  "requests",
  "paho-mqtt",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
secur = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
