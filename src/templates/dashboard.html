<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurityAI Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-row">
                <div class="logo-title">
                    <h1>Security</h1>
                    <span>Dashboard</span>
                </div>
            </div>
        </div>
        <nav>
            <button type="button" class="nav-link active" data-section="overview" id="nav-overview">
                <span class="icon">&#x1F4F7;</span>
                <span>Visão geral</span>
            </button>
            <button type="button" class="nav-link" data-section="events" id="nav-events">
                <span class="icon">&#x1F4CB;</span>
                <span>Eventos</span>
            </button>
            <button type="button" class="nav-link" data-section="cameras" id="nav-cameras">
                <span class="icon">&#x1F3A5;</span>
                <span>Câmeras</span>
            </button>
            <div class="nav-divider"></div>
            <div class="nav-group collapsed">
                <button type="button" class="nav-group-head" onclick="this.closest('.nav-group').classList.toggle('collapsed')">
                    <span class="icon">&#x2699;</span>
                    <span>Manutenção</span>
                    <span class="chev">&#9662;</span>
                </button>
                <div class="nav-group-list" id="crud-nav-list">
                    <button type="button" class="nav-sublink" data-section="zones">
                        <span class="dot" style="background:var(--info)"></span>
                        <span>Zonas</span>
                    </button>
                    <button type="button" class="nav-sublink" data-section="identities">
                        <span class="dot" style="background:var(--info)"></span>
                        <span>Identidades</span>
                    </button>
                    <button type="button" class="nav-sublink" data-section="users">
                        <span class="dot" style="background:var(--warn)"></span>
                        <span>Usuários</span>
                    </button>
                    <button type="button" class="nav-sublink" data-section="permissions">
                        <span class="dot" style="background:var(--danger)"></span>
                        <span>Permissões</span>
                    </button>
                    <button type="button" class="nav-sublink" data-section="audit">
                        <span class="dot" style="background:var(--muted)"></span>
                        <span>Auditoria</span>
                    </button>
                    <button type="button" class="nav-sublink" data-section="notifications">
                        <span class="dot" style="background:var(--primary)"></span>
                        <span>Notificações</span>
                    </button>
                    <button type="button" class="nav-sublink" data-section="settings">
                        <span class="dot" style="background:var(--muted-subtle)"></span>
                        <span>Configurações</span>
                    </button>
                    <button type="button" class="nav-sublink" data-section="retention">
                        <span class="dot" style="background:var(--warn)"></span>
                        <span>Retenção</span>
                    </button>
                </div>
            </div>
        </nav>
        <div class="footer-nav">
            <!--a href="#" id="nav-system-status">v0.2.0</a-->
            <div id="user-bar" class="user-bar" style="display:none;">
                <span id="user-bar-name"></span>
                <button type="button" id="logout-btn" class="btn-sm" title="Sair">Sair</button>
            </div>
        </div>
    </aside>

    <div class="main">
        <div id="main-page"><!-- seção lazy-load injetada aqui --></div>
        <footer id="app-footer" class="app-footer">
            <span id="status-health" class="status-bad">Status: …</span>
            <span id="status-cameras">Câmeras: —</span>
            <span id="status-workers">Workers: —</span>
            <span id="status-recent">Eventos recentes: —</span>
            <span id="status-uptime">Uptime: —</span>
            <span id="status-version">Versão: —</span>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="/static/camera_fault.js"></script>
    <script type="module" src="/static/shared.js"></script>
    <script type="module" src="/static/core.js"></script>
</body>
</html>
